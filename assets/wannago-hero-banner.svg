    <text x="28" y="38" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="600" fill="#86868B" letter-spacing="0.8">PROTOCOLE DETERMINISTE ACP (7 PORTES)</text>
    <line x1="28" y1="52" x2="320" y2="52" stroke="#333336" stroke-width="1"/>

    <text x="28" y="82" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">01  Brief &amp; Logo Maître</text>
    <text x="28" y="114" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">02  Lockups 0.001pt &amp; Squircle</text>
    <text x="28" y="146" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">03  WCAG AA/AAA, .ASE &amp; Print A4</text>
    <text x="28" y="178" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">04  4 Sites Web &amp; Promo.mp4 (20s)</text>
    <text x="28" y="210" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#64D2FF">05  Certification 100/100 (P0: 0)</text>
    <text x="28" y="242" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">06  9 Réseaux Sociaux &amp; SMS OTP</text>
    <text x="28" y="274" font-family="JetBrains Mono, monospace" font-size="12.5" fill="#F5F5F7">07  Publication Omnicanale</text>

    <line x1="28" y1="296" x2="320" y2="296" stroke="#333336" stroke-width="1"/>
    <text x="28" y="320" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#A1A1A6">Coffre AES-256-GCM  |  contact@wannago.tech</text>
